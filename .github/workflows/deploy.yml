name: Deploy edge proxy and database

on:
  push:
    branches: [main]
  workflow_dispatch:

# Checkout only. SSH uses repository secrets, not the token.
permissions:
  contents: read

concurrency:
  group: deploy-edge-proxy
  cancel-in-progress: false

env:
  INFRA_PATH: /home/deploy/vps-infra

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate Compose and Caddy configuration
        run: ./scripts/validate-config.sh

      - name: Prepare the VPS directory
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p ${{ vars.VPS_INFRA_PATH || env.INFRA_PATH }}/sites ${{ vars.VPS_INFRA_PATH || env.INFRA_PATH }}/scripts

      - name: Copy the configuration to the VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile,sites/**,scripts/**"
          target: ${{ vars.VPS_INFRA_PATH || env.INFRA_PATH }}
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.VPS_INFRA_PATH || env.INFRA_PATH }}

            docker network inspect edge-net >/dev/null 2>&1 \
              || docker network create edge-net

            sh scripts/init-secrets.sh
            mkdir -p backups

            docker compose pull --quiet

            # The nginx + certbot proxy and the older site-specific proxies
            # hold :80/:443. Stand them down right before Caddy takes over,
            # keeping the gap to a few seconds. Their certificates stay in
            # /etc/letsencrypt, so reverting this repo brings them back.
            for legacy in edge-proxy edge-certbot prayerroom-nginx hartvoorelkaar-nginx; do
              if [ -n "$(docker ps -aq -f "name=^${legacy}$")" ]; then
                echo "Removing legacy proxy container $legacy"
                docker rm -f "$legacy" >/dev/null
              fi
            done

            docker compose up -d --remove-orphans --wait --wait-timeout 120

            # Bind-mounted files changing does not restart Caddy; reload so
            # edited site files take effect. Caddy keeps the running config
            # when the new one is invalid.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

            for i in $(seq 1 30); do
              curl -fsS -o /dev/null http://127.0.0.1/healthz && break
              [ "$i" -eq 30 ] && { echo "proxy did not become healthy"; docker compose logs caddy --tail 60; exit 1; }
              sleep 1
            done
            echo "Proxy is healthy."

            # Leftovers of the nginx setup.
            rm -rf conf.d

            echo "Active sites:"
            ls sites/*.caddy | xargs -n1 basename
