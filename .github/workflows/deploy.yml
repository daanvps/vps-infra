name: Deploy edge proxy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue_certs:
        description: 'Request certificates for domains that do not have one yet'
        type: boolean
        default: true

# Checkout only. SSH uses repository secrets, not the token.
permissions:
  contents: read

concurrency:
  group: deploy-edge-proxy
  cancel-in-progress: false

env:
  INFRA_PATH: /home/deploy/vps-infra

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose and nginx configuration
        run: ./scripts/validate-config.sh

      - name: Prepare the VPS directory
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p ${{ vars.VPS_INFRA_PATH || env.INFRA_PATH }}/conf.d/include

      - name: Copy the proxy configuration to the VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,conf.d/**,scripts/**"
          target: ${{ vars.VPS_INFRA_PATH || env.INFRA_PATH }}
          overwrite: true

      - name: Deploy the proxy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL || vars.CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CERTBOT_EMAIL
          script: |
            set -e
            cd ${{ vars.VPS_INFRA_PATH || env.INFRA_PATH }}

            docker network inspect edge-net >/dev/null 2>&1 \
              || docker network create edge-net

            # A vhost whose certificate is missing would stop nginx from
            # starting, taking every other site down with it. Park those until
            # certbot has issued one.
            # /etc/letsencrypt is root owned, so list it through a container
            # rather than testing paths as the deploy user, which cannot read it
            # and would report every certificate as missing.
            certs=$(docker run --rm -v /etc/letsencrypt:/etc/letsencrypt:ro \
                      alpine sh -c 'ls /etc/letsencrypt/live 2>/dev/null' || true)
            echo "Certificates present: ${certs:-<none>}"

            # Restore anything parked by an earlier run before re-evaluating.
            for pending in conf.d/*.conf.pending; do
              [ -e "$pending" ] || continue
              mv "$pending" "${pending%.pending}"
            done

            for conf in conf.d/*.conf; do
              [ "$(basename "$conf")" = "00-default.conf" ] && continue

              # Only vhosts that reference a certificate can be broken by a
              # missing one; plain HTTP vhosts are always safe to load.
              cert=$(sed -n 's/^[[:space:]]*ssl_certificate[[:space:]]\+\([^;]*\);.*/\1/p' "$conf" | head -n1)
              [ -n "$cert" ] || continue

              name=$(basename "$conf" .conf)
              if ! echo "$certs" | grep -qx "$name"; then
                echo "No certificate for $name yet; parking its vhost."
                mv "$conf" "$conf.pending"
              fi
            done

            docker compose pull

            # A site-specific nginx from before the shared proxy would still be
            # holding :80/:443, so stand it down first. The proxy takes over in
            # the same step, keeping the gap to a few seconds.
            for legacy in prayerroom-nginx hartvoorelkaar-nginx; do
              if [ -n "$(docker ps -aq -f "name=^${legacy}$")" ]; then
                echo "Removing legacy proxy container $legacy"
                docker rm -f "$legacy" >/dev/null
              fi
            done

            docker compose up -d --remove-orphans

            # Wait for the proxy to answer before issuing challenges through it.
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null http://127.0.0.1/healthz && break
              [ "$i" -eq 30 ] && { echo "proxy did not become healthy"; docker compose logs proxy; exit 1; }
              sleep 1
            done
            echo "Proxy is healthy."

            for pending in conf.d/*.conf.pending; do
              [ -e "$pending" ] || continue
              domain=$(basename "$pending" .conf.pending)

              echo "Requesting a certificate for $domain"
              # POSIX sh: no arrays. Keep both branches explicit so a missing
              # email cannot break issuance for a brand-new site.
              if [ -n "${CERTBOT_EMAIL:-}" ]; then
                docker compose run --rm --entrypoint certbot certbot certonly \
                  --webroot -w /var/www/certbot \
                  -d "$domain" -d "www.$domain" \
                  --non-interactive --agree-tos \
                  --email "$CERTBOT_EMAIL" --no-eff-email \
                  --keep-until-expiring \
                  && issued=yes || issued=no
              else
                docker compose run --rm --entrypoint certbot certbot certonly \
                  --webroot -w /var/www/certbot \
                  -d "$domain" -d "www.$domain" \
                  --non-interactive --agree-tos \
                  --register-unsafely-without-email \
                  --keep-until-expiring \
                  && issued=yes || issued=no
              fi
              if [ "$issued" = "yes" ]; then
                mv "$pending" "conf.d/$domain.conf"
                echo "Certificate issued for $domain."
              else
                echo "::warning::Could not obtain a certificate for $domain. \
            Point the A records for $domain and www.$domain at this server, then \
            re-run this workflow. Other sites are unaffected."
              fi
            done

            if [ -n "${CERTBOT_EMAIL:-}" ]; then
              echo "Updating the Let's Encrypt account contact."
              if ! docker compose run --rm --entrypoint certbot certbot update_account \
                    --email "$CERTBOT_EMAIL" --no-eff-email --non-interactive; then
                echo "::warning::Could not update the Let's Encrypt account email. Other sites are unaffected. Re-run this workflow after checking CERTBOT_EMAIL."
              fi
            else
              echo "::warning::CERTBOT_EMAIL is not set, so Let's Encrypt will not send expiry notices. Add it as a repository secret (preferred) or variable, then re-run this workflow."
            fi

            docker compose exec -T proxy nginx -t
            docker compose exec -T proxy nginx -s reload
            echo "Active sites:"
            ls conf.d/*.conf | xargs -n1 basename
