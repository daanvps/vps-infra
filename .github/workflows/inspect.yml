name: Inspect VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report the current VPS state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/deploy/vps-infra || exit 0
            echo "=== containers ==="
            docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Ports}}'
            echo
            echo "=== proxy logs ==="
            docker compose logs proxy --tail 40 2>&1 || docker logs edge-proxy --tail 40 2>&1
            echo
            echo "=== conf.d on disk ==="
            ls -la conf.d/ conf.d/include/ 2>&1
            echo
            echo "=== certs ==="
            ls /etc/letsencrypt/live/ 2>&1 || echo "(no read access)"
