name: Inspect VPS

on:
  workflow_dispatch:

# Read-only: checks out this repo for the site list, then SSH.
permissions: {}

env:
  INFRA_PATH: ${{ vars.VPS_INFRA_PATH || '/home/deploy/vps-infra' }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Probe public ports 80 and 443
        id: probe
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          python3 - <<'PY'
          import os, socket, sys, urllib.request

          host = os.environ.get("VPS_HOST", "")
          if not host:
              print("::error::VPS_HOST secret is empty")
              sys.exit(1)

          def tcp_open(port, timeout=10):
              try:
                  infos = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
              except socket.gaierror as exc:
                  print(f"::warning::tcp/{port} name lookup failed ({type(exc).__name__})")
                  return False
              last = "unknown"
              for family, socktype, proto, _, addr in infos:
                  sock = socket.socket(family, socktype, proto)
                  sock.settimeout(timeout)
                  try:
                      sock.connect(addr)
                      print(f"tcp/{port}: reachable")
                      return True
                  except Exception as exc:
                      last = type(exc).__name__
                  finally:
                      sock.close()
              print(f"::warning::tcp/{port} unreachable ({last})")
              return False

          failed = False
          if not tcp_open(80):
              failed = True
          if not tcp_open(443):
              failed = True

          http_host = f"[{host}]" if ":" in host and not host.startswith("[") else host
          try:
              with urllib.request.urlopen(f"http://{http_host}/healthz", timeout=10) as resp:
                  body = resp.read(64)
                  print(f"http/80 /healthz: {resp.status} {body!r}")
                  if resp.status != 200 or body.strip() != b"ok":
                      print("::warning::port 80 answered, but /healthz was not the edge proxy")
                      failed = True
          except Exception as exc:
              print(f"::warning::http/80 /healthz failed ({type(exc).__name__})")
              failed = True

          if failed:
              print("Ports 80 and 443 must be reachable from the internet. See README.")
              sys.exit(1)
          PY

      - name: Check certificates from outside
        id: certs
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -u
          status=0
          # Every name a site file serves, apex and www.
          names=$(sed -n 's/^\([A-Za-z0-9.-]\+\(, *[A-Za-z0-9.-]\+\)*\) *{$/\1/p' sites/*.caddy | tr ',' '\n' | tr -d ' ' | sort -u)
          for name in $names; do
            end=$(echo | timeout 15 openssl s_client -connect "${VPS_HOST}:443" -servername "$name" 2>/dev/null \
                    | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            if [ -z "$end" ]; then
              echo "::warning::$name: no certificate served"
              status=1
              continue
            fi
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            echo "$name: expires $end ($days days)"
            if [ "$days" -lt 20 ]; then
              echo "::warning::$name expires within 20 days; Caddy renews at about 30 days left, so renewal is failing. See the Caddy logs below."
              status=1
            fi
          done
          exit $status

      - name: Report the current VPS state
        id: report
        continue-on-error: true
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          INFRA_PATH: ${{ env.INFRA_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: INFRA_PATH
          script: |
            fail=0

            echo "=== infra path ==="
            echo "$INFRA_PATH"
            if [ ! -d "$INFRA_PATH" ]; then
              echo "::warning::VPS_INFRA_PATH is not a directory on the server"
              fail=1
            else
              cd "$INFRA_PATH"
              echo
              echo "=== sites on disk ==="
              ls -la sites/ 2>&1 || true
              echo
              echo "=== Caddy logs ==="
              docker logs edge-caddy --tail 40 2>&1 || true
              echo
              echo "=== database backups ==="
              ls -la backups/ 2>&1 | tail -n 16 || true
            fi

            echo
            echo "=== containers ==="
            docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' || true

            echo
            echo "=== listening sockets ==="
            if command -v ss >/dev/null 2>&1; then
              listeners=$(ss -lnt 2>/dev/null | grep -E ':(80|443)([^0-9]|$)' || true)
              if [ -n "$listeners" ]; then
                echo "$listeners"
              else
                echo "(ss shows nothing on 80 or 443)"
              fi
              echo "$listeners" | grep -Eq ':80([^0-9]|$)' || { echo "::warning::port 80 is not listening"; fail=1; }
              echo "$listeners" | grep -Eq ':443([^0-9]|$)' || { echo "::warning::port 443 is not listening"; fail=1; }
            else
              echo "ss is not installed"
            fi

            echo
            echo "=== local healthz ==="
            if command -v curl >/dev/null 2>&1; then
              if curl -fsS --max-time 5 http://127.0.0.1/healthz; then
                echo
              else
                echo "::warning::http://127.0.0.1/healthz failed on the VPS"
                fail=1
              fi
            else
              echo "curl is not installed"
            fi

            echo
            echo "=== firewall ==="
            echo "-- ufw --"
            if command -v ufw >/dev/null 2>&1; then
              ufw status verbose 2>&1 || echo "(ufw status not permitted for this user)"
            else
              echo "ufw is not installed"
            fi
            echo "-- nft (first 120 lines) --"
            if command -v nft >/dev/null 2>&1; then
              nft list ruleset 2>&1 | head -n 120 || echo "(nft not permitted for this user)"
            else
              echo "nft is not installed"
            fi
            echo "-- iptables (first 120 lines) --"
            if command -v iptables >/dev/null 2>&1; then
              iptables -S 2>&1 | head -n 120 || echo "(iptables not permitted for this user)"
            else
              echo "iptables is not installed"
            fi
            echo "A provider firewall (cloud panel) is not visible here. The public port probe covers it."

            echo
            echo "=== database ==="
            docker exec shared-db pg_isready -U postgres 2>&1 || { echo "::warning::shared-db is not ready"; fail=1; }
            docker exec shared-db psql -U postgres -At -c "select datname from pg_database where not datistemplate and datname <> 'postgres' order by 1" 2>&1 || true

            exit "$fail"

      - name: Fail the run when a check failed
        if: always() && (steps.probe.outcome == 'failure' || steps.certs.outcome == 'failure' || steps.report.outcome == 'failure')
        run: |
          echo "Public port probe: ${{ steps.probe.outcome }}"
          echo "Certificates: ${{ steps.certs.outcome }}"
          echo "VPS report: ${{ steps.report.outcome }}"
          echo "Firewall output and Caddy logs are in the VPS report. See the README."
          exit 1
