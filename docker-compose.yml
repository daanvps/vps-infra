services:
  proxy:
    image: nginx:1.27-alpine
    container_name: edge-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    networks:
      - edge-net
    restart: unless-stopped
    command: >
      sh -c 'nginx -g "daemon off;" &
             nginxpid=$${!};
             while :; do
               sleep 6h;
               if [ -f /var/www/certbot/.renewed ]; then
                 rm -f /var/www/certbot/.renewed && nginx -s reload;
               fi;
             done &
             wait $${nginxpid}'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  certbot:
    image: certbot/certbot:latest
    container_name: edge-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - edge-net
    restart: unless-stopped
    entrypoint: >
      sh -c 'trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet --no-random-sleep-on-renew
                 --deploy-hook "touch /var/www/certbot/.renewed";
               sleep 12h & wait $${!};
             done'

volumes:
  certbot-webroot:
    name: edge-certbot-webroot

networks:
  edge-net:
    external: true
