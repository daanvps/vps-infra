# http-context baseline. nginx includes this file from the http block, and
# this name sorts before the vhosts. Content-Security-Policy is intentionally
# absent so an application can send its own without a second, conflicting
# policy from the proxy.
server_tokens off;

# OCSP stapling (include/tls.conf) needs a resolver that can see the public
# internet. Docker's embedded DNS cannot. Proxy locations set their own
# resolver for app containers and do not use this one.
resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
resolver_timeout 5s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;
gzip_min_length 256;
gzip_types
    text/css
    text/plain
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    application/wasm;

# Shared by include/proxy.conf. 30 req/s plus a large burst fits a Blazor
# WebAssembly first load (lots of small files at once). 1m holds on the
# order of 16k client addresses.
limit_req_zone $binary_remote_addr zone=edge:1m rate=30r/s;
limit_req_status 429;
limit_req_log_level warn;

# Catch-all. Answers ACME challenges for any domain and serves the health
# endpoint; anything else addressed to an unknown host is dropped.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        access_log off;
        return 444;
    }
}

# Unknown HTTPS names are rejected during the handshake, before any
# certificate is sent, so they cannot land on another site's vhost.
# ssl_reject_handshake does not need a certificate of its own.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
