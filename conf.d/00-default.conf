# Catch-all. Answers ACME challenges for any domain and serves the health
# endpoint; anything else addressed to an unknown host is dropped.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}
