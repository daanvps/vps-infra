# The prayer room app is not yet served on a real domain: its previous vhost
# used the yourdomain.com placeholder, which belongs to someone else. Until a
# domain is chosen it stays reachable over plain HTTP by IP, exactly as before.
#
# To give it a domain, rename this file to <domain>.conf, set server_name, and
# let the deploy issue a certificate.
server {
    listen 80;
    server_name prayerroom.localhost 149.210.244.242;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://prayerroom-api:5000;
        proxy_pass $api;
        include /etc/nginx/conf.d/include/proxy.conf;
    }

    location / {
        resolver 127.0.0.11 valid=10s;
        set $web http://prayerroom-web:5001;
        proxy_pass $web;
        include /etc/nginx/conf.d/include/proxy.conf;
    }
}
