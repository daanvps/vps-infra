server {
    listen 80;
    server_name thocko.com www.thocko.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name thocko.com www.thocko.com;

    ssl_certificate /etc/letsencrypt/live/thocko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thocko.com/privkey.pem;
    include /etc/nginx/conf.d/include/tls.conf;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://thocko-web:8080;
        proxy_pass $upstream;
        include /etc/nginx/conf.d/include/proxy.conf;
    }
}
