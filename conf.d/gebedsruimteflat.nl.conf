server {
    listen 80;
    server_name gebedsruimteflat.nl www.gebedsruimteflat.nl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gebedsruimteflat.nl www.gebedsruimteflat.nl;

    ssl_certificate /etc/letsencrypt/live/gebedsruimteflat.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gebedsruimteflat.nl/privkey.pem;
    include /etc/nginx/conf.d/include/tls.conf;

    # The Blazor client calls a relative /api/ path in production, so the two
    # upstreams are split here the way the old site-specific nginx did.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://prayerroom-api:5000;
        proxy_pass $api;
        include /etc/nginx/conf.d/include/proxy.conf;
    }

    location / {
        resolver 127.0.0.11 valid=10s;
        set $web http://prayerroom-web:5001;
        proxy_pass $web;
        include /etc/nginx/conf.d/include/proxy.conf;
    }
}
